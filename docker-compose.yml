services:
  syncdeck-rcd:
    image: rclone/rclone:latest
    container_name: syncdeck-rcd
    restart: unless-stopped
    command: >
      rcd
      --rc-addr=0.0.0.0:5572
      --rc-no-auth
      --rc-job-expire-duration=24h
      --rc-job-expire-interval=1h
    volumes:
      - rclone-config:/config/rclone
      - ${MEDIA_ROOT:-/mnt}:/mnt
    networks:
      - syncdeck-internal
      - syncdeck-egress
    # rclone RC is NOT exposed to host — only reached by syncdeck on internal network

  syncdeck:
    build: .
    container_name: syncdeck
    restart: unless-stopped
    depends_on:
      - syncdeck-rcd
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8780}:8768"
    environment:
      - RC_URL=http://syncdeck-rcd:5572
      - BIND=0.0.0.0
      - PORT=8768
      - DB_PATH=/data/syncdeck.db
      - ALLOWED_ROOTS=${ALLOWED_ROOTS:-/mnt}
    volumes:
      - syncdeck-data:/data
      - ${MEDIA_ROOT:-/mnt}:/mnt:ro  # read-only browsing
      - rclone-config:/config/rclone:ro
    networks:
      - syncdeck-internal
      - syncdeck-frontend

volumes:
  syncdeck-data:
  rclone-config:

networks:
  syncdeck-internal:
    driver: bridge
    internal: true  # isolates RC communication between app and daemon
  syncdeck-egress:
    driver: bridge  # gives syncdeck-rcd outbound internet access to cloud APIs (Drime, Drive, S3)
  syncdeck-frontend:
    driver: bridge  # enables host port publishing
