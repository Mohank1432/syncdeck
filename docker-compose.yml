services:
  syncdeck-rcd:
    image: rclone/rclone:latest
    container_name: syncdeck-rcd
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command: >
      rcd
      --rc-addr=0.0.0.0:5572
      --rc-no-auth
      --rc-job-expire-duration=24h
      --rc-job-expire-interval=1h
    volumes:
      - rclone-config:/config/rclone
      - ${MEDIA_ROOT:-/mnt}:/mnt
    networks:
      - syncdeck-net
    # Port 5572 is NOT published to host — only reachable inside Docker by syncdeck

  syncdeck:
    build: .
    container_name: syncdeck
    restart: unless-stopped
    depends_on:
      - syncdeck-rcd
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8780}:8768"
    environment:
      - RC_URL=http://syncdeck-rcd:5572
      - BIND=0.0.0.0
      - PORT=8768
      - DB_PATH=/data/syncdeck.db
      - ALLOWED_ROOTS=${ALLOWED_ROOTS:-/mnt}
    volumes:
      - syncdeck-data:/data
      - ${MEDIA_ROOT:-/mnt}:/mnt:ro  # read-only browsing
      - rclone-config:/config/rclone:ro
    networks:
      - syncdeck-net

volumes:
  syncdeck-data:
  rclone-config:

networks:
  syncdeck-net:
    driver: bridge
